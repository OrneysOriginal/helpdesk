<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${pageTitle})}"></head>

<body>
<nav th:replace="~{fragments :: navbar('home')}"></nav>

<main class="container py-5">
    <section class="hero-card p-5 rounded-4 border shadow-sm">
        <h1 class="display-5 fw-bold" th:text="${welcomeMessage}">
            Добро пожаловать
        </h1>

        <p class="lead mb-4">
            Учебная система для регистрации и сопровождения обращений пользователей.
        </p>

        <a class="btn btn-primary btn-lg" th:href="@{/contacts}">
            Связаться с поддержкой
        </a>
    </section>

    <section class="row g-4 mt-4">
        <div class="col-md-4" th:each="feature : ${features}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h5" th:text="${feature}">Функция</h2>
                    <p class="card-text text-muted">
                        Этот блок создан на основе данных, переданных из контроллера.
                    </p>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

<script th:replace="~{fragments :: bootstrapScripts}"></script>
</body>
</html>
