<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Создать заявку | Help Desk')}"></head>

<body class="bg-light">
<nav th:replace="~{fragments :: navbar('new-ticket')}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="mb-3">Создание заявки</h1>
                    <p class="text-muted mb-4">
                        Опишите проблему, и специалист поддержки свяжется с вами.
                    </p>

                    <form th:action="@{/tickets}" th:object="${ticket}" method="post">
                        <div class="mb-3">
                            <label for="customerName" class="form-label">Ваше имя</label>
                            <input id="customerName"
                                   type="text"
                                   class="form-control"
                                   th:field="*{customerName}"
                                   th:errorclass="is-invalid"
                                   placeholder="Например: Анна Иванова">

                            <div class="invalid-feedback" th:errors="*{customerName}">
                                Ошибка имени
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="title" class="form-label">Тема заявки</label>
                            <input id="title"
                                   type="text"
                                   class="form-control"
                                   th:field="*{title}"
                                   th:errorclass="is-invalid"
                                   placeholder="Например: Не работает принтер">

                            <div class="invalid-feedback" th:errors="*{title}">
                                Ошибка темы
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">Описание проблемы</label>
                            <textarea id="description"
                                      rows="6"
                                      class="form-control"
                                      th:field="*{description}"
                                      th:errorclass="is-invalid"
                                      placeholder="Опишите, что произошло"></textarea>

                            <div class="invalid-feedback" th:errors="*{description}">
                                Ошибка описания
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Отправить заявку
                            </button>

                            <a th:href="@{/tickets}" class="btn btn-outline-secondary">
                                Назад к списку
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: bootstrapScripts}"></script>
</body>
</html>
