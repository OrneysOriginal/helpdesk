<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Вход администратора | Help Desk')}"></head>

<body class="bg-light">
<nav th:replace="~{fragments :: navbar('login')}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h1 class="h3 mb-3 text-center">Вход администратора</h1>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Неверный логин или пароль.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success">
                        Вы вышли из системы.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input type="text"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   placeholder="admin">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="admin">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Войти
                        </button>
                    </form>

                </div>
            </div>

            <p class="text-muted small mt-3 text-center">
                Учебный доступ: admin / admin
            </p>

        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: bootstrapScripts}"></script>
</body>
</html>
