<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Help Desk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav ms-auto">
                <a class="nav-link"
                   th:classappend="${activePage == 'home'} ? ' active'"
                   th:href="@{/}">
                    Главная
                </a>

                <a class="nav-link"
                   th:classappend="${activePage == 'tickets'} ? ' active'"
                   th:href="@{/tickets}">
                    Заявки
                </a>

                <a class="nav-link"
                   th:classappend="${activePage == 'new-ticket'} ? ' active'"
                   th:href="@{/tickets/new}">
                    Создать заявку
                </a>

                <a class="nav-link"
                   th:classappend="${activePage == 'about'} ? ' active'"
                   th:href="@{/about}">
                    О нас
                </a>

                <a class="nav-link"
                   th:classappend="${activePage == 'contacts'} ? ' active'"
                   th:href="@{/contacts}">
                    Контакты
                </a>
            </div>
        </div>
    </div>
</nav>

<nav th:fragment="adminNavbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/tickets}">
            Help Desk Admin
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/tickets/new}">
                Создать заявку
            </a>

            <form th:action="@{/logout}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="btn btn-warning btn-sm">
                    Выйти
                </button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="py-4 border-top bg-white">
</footer>

<script th:fragment="bootstrapScripts"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
