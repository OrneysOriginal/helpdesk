<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Help Desk</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>

        <div class="navbar-nav">
            <a class="nav-link"
               th:classappend="${activePage == 'home'} ? ' active'"
               th:href="@{/}">
                Главная
            </a>

            <a class="nav-link"
               th:classappend="${activePage == 'tickets'} ? ' active'"
               th:href="@{/tickets}">
                Заявки
            </a>

            <a class="nav-link"
               th:classappend="${activePage == 'about'} ? ' active'"
               th:href="@{/about}">
                О нас
            </a>

            <a class="nav-link"
               th:classappend="${activePage == 'contacts'} ? ' active'"
               th:href="@{/contacts}">
                Контакты
            </a>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer py-4 border-top">
    <div class="container text-center text-muted">
        Help Desk - учебный проект на Spring Boot
    </div>
</footer>

<script th:fragment="bootstrapScripts"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
