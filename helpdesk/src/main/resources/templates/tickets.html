<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Заявки | Help Desk')}"></head>

<body class="bg-light">
<nav th:replace="~{fragments :: navbar('tickets')}"></nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Список заявок</h1>
            <p class="text-muted mb-0">Все обращения пользователей Help Desk</p>
        </div>

        <a th:href="@{/tickets/new}" class="btn btn-primary">
            Создать заявку
        </a>
    </div>

    <div class="table-responsive shadow-sm rounded bg-white">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Пользователь</th>
                <th>Тема</th>
                <th>Статус</th>
                <th>Дата создания</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}">1</td>
                <td th:text="${ticket.customerName}">Анна</td>
                <td th:text="${ticket.title}">Не работает принтер</td>
                <td>
                    <span class="badge bg-secondary" th:text="${ticket.status}">
                        NEW
                    </span>
                </td>
                <td th:text="${ticket.createdAt}">2026-05-28T10:30</td>
            </tr>

            <tr th:if="${#lists.isEmpty(tickets)}">
                <td colspan="5" class="text-center text-muted py-4">
                    Пока нет ни одной заявки
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: bootstrapScripts}"></script>
</body>
</html>
